## YOLO11 OBB with ReCalibrationFPN-P2345 style neck/head
#
### Parameters
##nc: 5  # number of classes
##
##scales:
##  # [depth, width, max_channels]
##  n: [0.50, 0.25, 1024]
##  s: [0.50, 0.50, 1024]
##  m: [0.50, 1.00, 512]
##  l: [1.00, 1.00, 512]
##  x: [1.00, 1.50, 512]
##
### YOLO11 backbone (same as your OBB yaml)
##backbone:
##  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2
##  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4
##  - [-1, 2, C3k2, [256, False, 0.25]]
##  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8
##  - [-1, 2, C3k2, [512, False, 0.25]]
##  - [-1, 1, Conv, [512, 3, 2]]       # 5-P4/16
##  - [-1, 2, C3k2, [512, True]]
##  - [-1, 1, Conv, [1024, 3, 2]]      # 7-P5/32
##  - [-1, 2, C3k2, [1024, True]]
##  - [-1, 1, SPPF, [1024, 5]]         # 9
##  - [-1, 2, C2PSA, [1024]]           # 10
##
### ReCalibrationFPN-P2345 style head + OBB head
##head:
##  # 从 P5(10) + P4(6) 做一次 SBA 校准 -> P4'
##  - [[-1, 6], 1, SBA, []]            # 11 (P4/16)
##  - [-1, 2, C3k2, [512, False]]      # 12
##
##  # 从 P4'(12) + P3(4) 做 SBA -> P3'
##  - [[-1, 4], 1, SBA, []]            # 13 (P3/8)
##  - [-1, 2, C3k2, [256, False]]      # 14
##
##  # 从 P3'(14) + P2(2) 做 SBA -> P2'
##  - [[-1, 2], 1, SBA, []]            # 15 (P2/4)
##  - [-1, 2, C3k2, [128, False]]      # 16   -> P2
##
##  # 逐级再“回流”校准：P2 -> P3 -> P4 -> P5
##  - [[-1, 14], 1, SBA, []]           # 17 (P3/8)
##  - [-1, 2, C3k2, [256, False]]      # 18   -> P3
##
##  - [[-1, 12], 1, SBA, []]           # 19 (P4/16)
##  - [-1, 2, C3k2, [512, False]]      # 20   -> P4
##
##  - [[-1, 10], 1, SBA, []]           # 21 (P5/32)
##  # 这里 P5 的通道数你原来改成了 512；我先按你原风格保留 512，避免你 OBB head 里额外改动
##  - [-1, 2, C3k2, [512, True]]       # 22   -> P5
##
##  # ✅ 四尺度 OBB Head：P2,P3,P4,P5
##  - [[16, 18, 20, 22], 1, OBB_LSCD_LQE, [nc, 1, 256]]
